name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_POLICY_ADVISORIES_BLOCK: 0

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            laravel: '8'
            testbench: '^6.47'
            phpunit: '^9.6'
          - php: '8.0'
            laravel: '9'
            testbench: '^7.56'
            phpunit: '^9.6'
          - php: '8.1'
            laravel: '10'
            testbench: '^8.37'
            phpunit: '^10.5'
          - php: '8.2'
            laravel: '11'
            testbench: '^9.17'
            phpunit: '^11.5'
          - php: '8.2'
            laravel: '12'
            testbench: '^10.11'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.1'
            phpunit: '^11.5'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.1'
            phpunit: '^11.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Select dependency generation
        run: |
          composer require --dev \
            orchestra/testbench:${{ matrix.testbench }} \
            phpunit/phpunit:${{ matrix.phpunit }} \
            --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run tests
        run: composer test
